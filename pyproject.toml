[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]

name = "investment-analyzer-v11"

version = "11.0.0"

description = "Professional Investment Analysis Platform"

readme = "README.md"

requires-python = ">=3.12"

license = {text="MIT"}

authors = [
    {name="Nuria Ledezma"}
]

dependencies = []

[tool.pytest.ini_options]

pythonpath = [
    "src"
]

testpaths = [
    "tests"
]

[tool.ruff]

line-length = 100

target-version="py312"

[tool.black]

line-length = 100

target-version=["py312"]