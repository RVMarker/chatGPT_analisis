[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-analyzer-v11"
version = "11.0.0"
description = "Professional Investment Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text="MIT"}
authors = [{name="Nuria Ledezma"}]
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.65"]
full = [
    "yfinance>=0.2.65",
    "pandas>=2.2.3",
    "numpy>=2.1.2",
    "scipy>=1.15.0",
    "statsmodels>=0.14.4",
    "plotly>=5.24.1",
    "matplotlib>=3.10.0",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "SQLAlchemy>=2.0.36",
    "openpyxl>=3.1.5",
    "jinja2>=3.1.5",
    "weasyprint>=64.0",
    "python-docx>=1.1.2",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "loguru>=0.7.3",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "diskcache>=5.6.3",
    "tqdm>=4.67.1",
]
test = ["pytest>=8.3.4", "pytest-cov>=6.0.0"]

[project.scripts]
investment-analyzer = "investment_analyzer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version="py312"

[tool.black]
line-length = 100
target-version=["py312"]
